name: Dependency checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-26.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install project tools
        uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          version: "2026.10.19"

      - name: Install Hex
        run: mise exec -- mix local.hex --force

      - name: Resolve current dependencies
        run: mise exec -- mix deps.update --all

      - name: Compile with warnings as errors
        run: mise exec -- mix compile --warnings-as-errors

      - name: Check formatting
        run: mise exec -- mix format --check-formatted

      - name: Check JavaScript syntax
        run: mise exec -- node --check assets/js/live_select.js

      - name: Build Hex package
        run: mise exec -- mix hex.build

      - name: Inspect JavaScript package
        run: mise exec -- npm pack --dry-run
